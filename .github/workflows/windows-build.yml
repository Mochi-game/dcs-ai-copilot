name: Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "2.0"
      buy_me_a_coffee_url:
        description: "Optional Buy Me a Coffee URL"
        required: false
        default: "https://buymeacoffee.com/myriskdashk"
      require_license:
        description: "Fail the build unless LICENSE exists"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve release settings
        shell: pwsh
        run: |
          $Version = "${{ inputs.version }}"
          if (-not $Version) {
            $Version = "${env:GITHUB_REF_NAME}"
            if ($Version.StartsWith("v")) {
              $Version = $Version.Substring(1)
            }
          }
          $BuyMeACoffeeUrl = "${{ inputs.buy_me_a_coffee_url }}"
          if (-not $BuyMeACoffeeUrl) {
            $BuyMeACoffeeUrl = "https://buymeacoffee.com/myriskdashk"
          }
          $RequireLicense = "${{ inputs.require_license }}"
          if (-not $RequireLicense) {
            $RequireLicense = "true"
          }
          "RELEASE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUY_ME_A_COFFEE_URL=$BuyMeACoffeeUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REQUIRE_LICENSE=$RequireLicense" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable app
        shell: pwsh
        run: |
          $BuildArgs = @(
            "-Version", "${env:RELEASE_VERSION}",
            "-BuyMeACoffeeUrl", "${env:BUY_ME_A_COFFEE_URL}",
            "-RequireInstaller"
          )
          if ("${env:REQUIRE_LICENSE}" -eq "true") {
            $BuildArgs += "-RequireLicense"
          }
          & .\packaging\windows\build_windows.ps1 @BuildArgs

      - name: Smoke test release artifacts
        shell: pwsh
        run: .\packaging\windows\Test-Release-Smoke.ps1 -Version "${env:RELEASE_VERSION}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcs-ai-copilot-windows-${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.zip
            release/RELEASE_NOTES-*.md
            packaging/windows/DCS-AI-Copilot.generated.iss

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/RELEASE_NOTES-${{ env.RELEASE_VERSION }}.md
          files: |
            release/DCS-AI-Copilot-Setup-${{ env.RELEASE_VERSION }}.exe
            release/DCS-AI-Copilot-portable-${{ env.RELEASE_VERSION }}.zip
            release/RELEASE_NOTES-${{ env.RELEASE_VERSION }}.md
